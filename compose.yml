services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  keys:
    image: job-tracker-local
    build: .
    command:
      - node
      - --input-type=module
      - -e
      - |
        import { generateKeyPairSync } from "node:crypto";
        import { existsSync, writeFileSync } from "node:fs";
        const privatePath = "/app/.local/auth-private.pem";
        const publicPath = "/app/.local/auth-public.pem";
        if (existsSync(privatePath) !== existsSync(publicPath)) throw new Error("Both signing key files are required.");
        if (!existsSync(privatePath)) {
          const { privateKey, publicKey } = generateKeyPairSync("ed25519", {
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
            publicKeyEncoding: { type: "spki", format: "pem" },
          });
          writeFileSync(privatePath, privateKey, { mode: 0o600, flag: "wx" });
          writeFileSync(publicPath, publicKey, { flag: "wx" });
        }
    volumes:
      - signing-keys:/app/.local

  auth:
    image: job-tracker-local
    command: ["pnpm", "--filter", "@job-tracker/auth", "dev"]
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    volumes:
      - signing-keys:/app/.local:ro
    depends_on:
      mongo:
        condition: service_healthy
      keys:
        condition: service_completed_successfully

  tracker:
    image: job-tracker-local
    command: ["pnpm", "--filter", "@job-tracker/tracker", "dev"]
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      AUTH_URL: http://auth:3001
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - signing-keys:/app/.local:ro
    depends_on:
      mongo:
        condition: service_healthy
      keys:
        condition: service_completed_successfully

  web:
    image: job-tracker-local
    command: ["pnpm", "--dir", "apps/web", "exec", "vite", "--host", "0.0.0.0"]
    environment:
      AUTH_URL: http://auth:3001
      TRACKER_URL: http://tracker:3002
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - auth
      - tracker

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - tracker

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          ollama pull "$$OLLAMA_MODEL"
        fi

volumes:
  mongo-data:
  signing-keys:
  ollama-models:
