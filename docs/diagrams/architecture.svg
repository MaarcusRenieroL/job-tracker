<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <!-- Excalidraw subtle hand-drawn sketchy stroke filter (applied only to shapes/paths, never text) -->
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Subtle Excalidraw whiteboard dot grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#dcdad0"/>
    </pattern>
    <!-- Hand-drawn arrowheads -->
    <marker id="arrow-slate" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#6741d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .hand-title { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-weight: 700; fill: #1e1e24; }
      .hand-sub   { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-weight: 600; fill: #495057; }
      .label      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 13px; fill: #2b2d42; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 13px; font-weight: 700; fill: #1e1e24; }
      .mono       { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 11.5px; fill: #343a40; }
      .mono-sm    { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 10.5px; fill: #495057; }
      .zone-lbl   { font-family: 'Virgil', 'Segoe Print', 'Bradley Hand', 'Chalkboard SE', cursive, sans-serif; font-size: 14px; font-weight: 700; fill: #6c757d; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="760" rx="16" fill="#fdfdfb"/>
  <rect width="1280" height="760" rx="16" fill="url(#dot-grid)"/>

  <!-- Header -->
  <text x="40" y="48" class="hand-title" font-size="26">Job Tracker — Microservice Architecture</text>
  <text x="40" y="72" class="hand-sub" font-size="14">Local-first TypeScript monorepo · Stateless Ed25519 JWT boundary · DB-per-service MongoDB · Optional Ollama AI &amp; OTel</text>

  <!-- Docker Compose Network Zone -->
  <rect x="330" y="96" width="914" height="476" rx="18" fill="#f8f9fa" fill-opacity="0.65" stroke="#adb5bd" stroke-width="2" stroke-dasharray="9 6" filter="url(#sketch)"/>
  <text x="350" y="120" class="zone-lbl">Docker Compose Internal Network</text>

  <!-- 1. React Web Client -->
  <g filter="url(#sketch)">
    <rect x="36" y="170" width="246" height="310" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.4"/>
    <line x1="36" y1="224" x2="282" y2="224" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="56" y="200" class="hand-title" font-size="18" fill="#1864ab">React 19 Web Client</text>
  <text x="56" y="216" class="mono-sm">apps/web · Vite 8 · :5173</text>

  <text x="56" y="248" class="label-bold">UI &amp; Forms</text>
  <text x="56" y="268" class="label">• shadcn + React Aria UI</text>
  <text x="56" y="287" class="label">• React Hook Form + Zod</text>
  <text x="56" y="306" class="label">• Split-screen PDF Studio</text>
  <text x="56" y="325" class="label">• Table, Kanban, Agenda</text>
  <text x="56" y="344" class="label">• Offers &amp; Analytics</text>

  <rect x="52" y="362" width="214" height="102" rx="10" fill="#ffffff" stroke="#74c0fc" stroke-width="1.5" filter="url(#sketch)"/>
  <text x="64" y="382" class="label-bold" fill="#1864ab">Vite Dev / Proxy Routes</text>
  <text x="64" y="401" class="mono-sm">/auth/*       -&gt; auth:3001</text>
  <text x="64" y="418" class="mono-sm">/applications -&gt; tracker:3002</text>
  <text x="64" y="435" class="mono-sm">/profile      -&gt; tracker:3002</text>
  <text x="64" y="452" class="mono-sm">/docs /guide  -&gt; Scalar UI</text>

  <!-- 2. Auth Service -->
  <g filter="url(#sketch)">
    <rect x="372" y="142" width="290" height="176" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2.4"/>
    <line x1="372" y1="194" x2="662" y2="194" stroke="#6741d9" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="392" y="170" class="hand-title" font-size="18" fill="#5f3dc4">Auth Service</text>
  <text x="392" y="186" class="mono-sm">services/auth · Hono · :3001</text>
  <text x="392" y="216" class="label">• Argon2id password hashing</text>
  <text x="392" y="236" class="label">• 15m Ed25519 (EdDSA) JWT signing</text>
  <text x="392" y="256" class="label">• Sliding-window IP rate limiter (429)</text>
  <text x="392" y="276" class="label">• Scalar OpenAPI 3.1 (<tspan class="mono-sm">/auth/docs</tspan>)</text>
  <text x="392" y="296" class="label">• Health &amp; metrics (<tspan class="mono-sm">/ready</tspan>, <tspan class="mono-sm">/metrics</tspan>)</text>

  <!-- 3. Ed25519 Keys Init Container -->
  <g filter="url(#sketch)">
    <rect x="698" y="296" width="204" height="82" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <text x="716" y="320" class="hand-title" font-size="15" fill="#d9480f">Ed25519 Keys (init)</text>
  <text x="716" y="340" class="mono-sm">volume: signing-keys (ro)</text>
  <text x="716" y="358" class="label" font-size="12">Private -&gt; Auth · Public -&gt; Tracker</text>

  <!-- 4. Tracker Service -->
  <g filter="url(#sketch)">
    <rect x="372" y="360" width="290" height="194" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.4"/>
    <line x1="372" y1="412" x2="662" y2="412" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="392" y="388" class="hand-title" font-size="18" fill="#2b8a3e">Tracker Service</text>
  <text x="392" y="404" class="mono-sm">services/tracker · Hono · :3002</text>
  <text x="392" y="434" class="label">• Stateless local Ed25519 verification</text>
  <text x="392" y="454" class="label">• Strict tenant isolation (<tspan class="mono-sm">ownerId</tspan>)</text>
  <text x="392" y="474" class="label">• Atomic OCC (<tspan class="mono-sm">version</tspan> -&gt; HTTP 409)</text>
  <text x="392" y="494" class="label">• Deterministic resume skill matcher</text>
  <text x="392" y="514" class="label">• SSRF-guarded posting URL importer</text>
  <text x="392" y="534" class="label">• Scalar OpenAPI (<tspan class="mono-sm">/docs</tspan>) &amp; <tspan class="mono-sm">/guide</tspan></text>

  <!-- 5. MongoDB (Auth DB + Tracker DB) -->
  <g filter="url(#sketch)">
    <rect x="944" y="142" width="276" height="238" rx="14" fill="#e6fcf5" stroke="#099268" stroke-width="2.4"/>
    <line x1="944" y1="194" x2="1220" y2="194" stroke="#099268" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="964" y="170" class="hand-title" font-size="18" fill="#087f5b">MongoDB 7</text>
  <text x="964" y="186" class="mono-sm">mongo:27017 · DB-per-service</text>

  <rect x="962" y="208" width="240" height="64" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.8" filter="url(#sketch)"/>
  <text x="976" y="230" class="mono" font-weight="700" fill="#5f3dc4">job_tracker_auth</text>
  <text x="976" y="250" class="label">• <tspan class="mono-sm">users</tspan> (unique email)</text>

  <rect x="962" y="286" width="240" height="80" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.8" filter="url(#sketch)"/>
  <text x="976" y="308" class="mono" font-weight="700" fill="#2b8a3e">job_tracker_tracker</text>
  <text x="976" y="328" class="label">• <tspan class="mono-sm">profiles</tspan> (resumeVersions)</text>
  <text x="976" y="348" class="label">• <tspan class="mono-sm">applications</tspan> (embedded)</text>

  <!-- 6. Ollama Local AI -->
  <g filter="url(#sketch)">
    <rect x="944" y="406" width="276" height="148" rx="14" fill="#fff4e6" stroke="#d9480f" stroke-width="2.4"/>
    <line x1="944" y1="458" x2="1220" y2="458" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <text x="964" y="434" class="hand-title" font-size="18" fill="#d9480f">Ollama Local LLM</text>
  <text x="964" y="450" class="mono-sm">ollama:11434 · qwen2.5:1.5b (optional)</text>
  <text x="964" y="480" class="label">• Job-fit explanation &amp; extraction</text>
  <text x="964" y="500" class="label">• Role-specific interview prep</text>
  <text x="964" y="520" class="label">• Editable referral / cover / follow-up</text>
  <text x="964" y="540" class="mono-sm">JSON-only data · Zod validated</text>

  <!-- Bottom Strip: Observability & Shared Packages -->
  <g filter="url(#sketch)">
    <rect x="36" y="600" width="590" height="128" rx="14" fill="#fff5f5" stroke="#c92a2a" stroke-width="2.2"/>
    <rect x="654" y="600" width="590" height="128" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2.2"/>
  </g>
  <text x="56" y="628" class="hand-title" font-size="17" fill="#c92a2a">Observability Stack (profile: observability)</text>
  <text x="56" y="654" class="label">• <tspan class="label-bold">Pino JSON Logs:</tspan> requestId + traceId + secret redaction</text>
  <text x="56" y="676" class="label">• <tspan class="label-bold">Prometheus (:9090):</tspan> scrapes <tspan class="mono-sm">/metrics</tspan> (HTTP &amp; AI latency/counts)</text>
  <text x="56" y="698" class="label">• <tspan class="label-bold">Jaeger (:16686):</tspan> OTLP HTTP traces across Auth, Tracker &amp; Ollama</text>

  <text x="674" y="628" class="hand-title" font-size="17" fill="#343a40">Shared Monorepo Packages</text>
  <text x="674" y="654" class="label">• <tspan class="mono">packages/application-options</tspan> — single source of truth for</text>
  <text x="688" y="674" class="label">  enums, Zod schemas, clearable keys &amp; API contracts</text>
  <text x="674" y="698" class="label">• <tspan class="mono">packages/observability</tspan> — Pino, AppError, security headers, OTel</text>

  <!-- Connectors -->
  <!-- Web -> Auth -->
  <path d="M 282 260 C 324 260, 326 226, 370 226" fill="none" stroke="#6741d9" stroke-width="2.2" marker-end="url(#arrow-violet)" filter="url(#sketch)"/>
  <rect x="290" y="216" width="76" height="20" rx="6" fill="#fdfdfb" stroke="#d0bfff" stroke-width="1"/>
  <text x="297" y="230" class="mono-sm">/auth/*</text>

  <!-- Web -> Tracker -->
  <path d="M 282 365 C 324 365, 326 446, 370 446" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#arrow-green)" filter="url(#sketch)"/>
  <rect x="284" y="400" width="84" height="20" rx="6" fill="#fdfdfb" stroke="#b2f2bb" stroke-width="1"/>
  <text x="290" y="414" class="mono-sm">Bearer JWT</text>

  <!-- Tracker -> Auth readiness -->
  <path d="M 515 360 L 515 320" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-slate)" filter="url(#sketch)"/>
  <rect x="412" y="328" width="208" height="20" rx="6" fill="#fdfdfb" stroke="#ced4da" stroke-width="1"/>
  <text x="420" y="342" class="mono-sm">GET /ready + traceparent</text>

  <!-- Keys -> Auth & Tracker -->
  <path d="M 745 296 C 728 265, 694 252, 664 252" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" filter="url(#sketch)"/>
  <path d="M 745 378 C 728 408, 694 420, 664 420" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" filter="url(#sketch)"/>

  <!-- Auth -> MongoDB Auth DB -->
  <path d="M 662 222 C 770 222, 850 236, 960 236" fill="none" stroke="#6741d9" stroke-width="2.2" marker-end="url(#arrow-violet)" filter="url(#sketch)"/>

  <!-- Tracker -> MongoDB Tracker DB -->
  <path d="M 662 430 C 795 430, 860 326, 960 326" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#arrow-green)" filter="url(#sketch)"/>

  <!-- Tracker -> Ollama -->
  <path d="M 662 492 C 780 492, 850 484, 942 484" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-amber)" filter="url(#sketch)"/>
  <rect x="744" y="466" width="152" height="20" rx="6" fill="#fdfdfb" stroke="#ffd8a8" stroke-width="1"/>
  <text x="752" y="480" class="mono-sm">POST /api/chat + retry</text>

  <!-- Services -> Observability -->
  <path d="M 480 554 L 480 598" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-coral)" filter="url(#sketch)"/>
  <rect x="380" y="567" width="204" height="20" rx="6" fill="#fdfdfb" stroke="#ffc9c9" stroke-width="1"/>
  <text x="388" y="581" class="mono-sm">OTLP traces · /metrics · Pino</text>
</svg>
